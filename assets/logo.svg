<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoStroke" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#22ffa8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#03050a"/>
  <!-- pins -->
  <g stroke="url(#logoStroke)" stroke-width="3" stroke-linecap="round">
    <line x1="30" y1="10" x2="30" y2="20"/>
    <line x1="50" y1="10" x2="50" y2="20"/>
    <line x1="70" y1="10" x2="70" y2="20"/>
    <line x1="30" y1="80" x2="30" y2="90"/>
    <line x1="50" y1="80" x2="50" y2="90"/>
    <line x1="70" y1="80" x2="70" y2="90"/>
    <line x1="10" y1="30" x2="20" y2="30"/>
    <line x1="10" y1="50" x2="20" y2="50"/>
    <line x1="10" y1="70" x2="20" y2="70"/>
    <line x1="80" y1="30" x2="90" y2="30"/>
    <line x1="80" y1="50" x2="90" y2="50"/>
    <line x1="80" y1="70" x2="90" y2="70"/>
  </g>
  <!-- chip body -->
  <rect x="20" y="20" width="60" height="60" rx="9" fill="#060a14" stroke="url(#logoStroke)" stroke-width="2.4"/>
  <!-- pin 1 indicator -->
  <circle cx="28" cy="28" r="2.6" fill="#22ffa8"/>
  <!-- inner circuit monogram (M as circuit traces) -->
  <g fill="none" stroke="url(#logoStroke)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33 65 V38 L50 58 L67 38 V65"/>
  </g>
  <g fill="#9dffd6">
    <circle cx="33" cy="38" r="2.2"/>
    <circle cx="67" cy="38" r="2.2"/>
    <circle cx="50" cy="58" r="2.2"/>
  </g>
</svg>
